# PRODUCTION-LIKE (staging / single-host) reference. Not a turnkey production
# deployment: no HA, no replication, no automated backups. See ../README.md
# and ../../13-cloud-production/README.md for the managed-service tradeoff.
#
# Usage:  umask 077
#         printf '%s' 'GENERATED_PASSWORD' > secrets/postgres_password.txt
#         POSTGRES_USER=app_admin POSTGRES_DB=appdb \
#           docker compose -f compose.prod-like.yaml up -d
name: pgplaybook-prodlike

services:
  db:
    # Pin the exact tag (or digest) you tested. Never :latest.
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      # The entrypoint reads the password from the mounted secret file.
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      # Applied only at first initialization (empty data dir).
      POSTGRES_INITDB_ARGS: "--data-checksums"
    secrets:
      - postgres_password
    # No "ports:" on purpose. Clients reach the database over the internal
    # network. Add "127.0.0.1:5432:5432" only for host-local admin access.
    networks:
      - backend
    volumes:
      # PostgreSQL 17 and below. For 18+ mount at /var/lib/postgresql instead.
      - pgdata:/var/lib/postgresql/data
    shm_size: 256mb
    stop_grace_period: 60s
    # Starting values for illustration; size against your workload and RAM.
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - shared_buffers=512MB
      - -c
      - log_min_duration_statement=500ms
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

networks:
  backend:
    internal: true

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt

volumes:
  pgdata:
