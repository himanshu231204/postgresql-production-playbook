# LOCAL DEVELOPMENT ONLY. Not a production deployment file.
# Usage:  cp .env.example .env   (edit placeholders)
#         docker compose -f compose.dev.yaml up -d
name: pgplaybook-dev

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:16}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      # Loopback only. Never "5432:5432" (that binds all host interfaces).
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 17 and below. For 18+ mount at /var/lib/postgresql instead.
      - pgdata:/var/lib/postgresql/data
    shm_size: 256mb
    healthcheck:
      # -h 127.0.0.1 forces TCP: the init-time temporary server listens only on
      # the Unix socket, so a socket check can report ready too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Requires your application source (requirements.txt + app/) next to the
  # Dockerfile. Started only with:  docker compose --profile app up -d
  app:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
